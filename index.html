<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цветочная поляна — нейроквест</title>
<style>
:root{color-scheme:light;--ink:#5e4b67;--purple:#86508e;--pink:#e991be;--mint:#6fb88f;--line:#d9c6dc}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent!important;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #538fe0;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.5}
#app{min-height:100vh;padding:clamp(5px,1.2vw,14px);display:flex;align-items:center;justify-content:center;background:transparent!important}
.shell{width:min(100%,1040px);min-height:min(625px,96vh);padding:clamp(12px,2vw,23px);border-radius:28px;border:1.5px solid rgba(255,255,255,.7);background:rgba(220,223,228,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 13px 35px rgba(64,51,78,.18);display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;padding:6px 8px}.title{font-weight:900;font-size:clamp(18px,2.4vw,28px);color:#895093}.sub{font-weight:700;font-size:12px;color:#8c7495}.tag{padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.78);font-size:13px;font-weight:800;color:#8a5691}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tab,.level{border:1px solid #d9badb;border-radius:15px;padding:9px 6px;background:rgba(255,255,255,.79);color:#765781;font-weight:800;font-size:clamp(11px,1.42vw,15px)}.tab.active,.level.active{background:linear-gradient(115deg,#e88dbf,#af95e6);color:white;border-color:transparent}.tab.done,.level.done{background:#d9f1e1;color:#40835b;border-color:#a9d2b8}
.levels{display:flex;gap:8px;justify-content:center;align-items:center}.level{padding:7px 18px;border-radius:30px}
.stage{flex:1;min-height:320px;border-radius:23px;border:1px solid rgba(255,255,255,.8);background:rgba(251,251,253,.70);padding:clamp(12px,1.8vw,22px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
h1{font-size:clamp(20px,2.6vw,31px);margin:0;color:#815188;line-height:1.16}.instruction{font-size:clamp(14px,1.65vw,18px);font-weight:700;margin:0;line-height:1.45;max-width:750px}.detail{font-size:13px;color:#806c87;margin:0;line-height:1.4}.mini{font-size:12px;color:#8c7691}
.btn{border:0;border-radius:24px;background:linear-gradient(115deg,#e58bbd,#a68bdf);color:white;padding:11px 19px;min-height:44px;font-weight:900;box-shadow:0 4px 0 #9c75ac}.btn.secondary{background:rgba(255,255,255,.93);color:#895c9c;border:1px solid #d9bddd;box-shadow:none}.btn.good{background:#77b99a;box-shadow:0 4px 0 #57977a}.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px}.feedback{font-weight:900;font-size:16px;min-height:20px;color:#a04e78;text-align:center}.feedback.ok{color:#398963}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.39);border-radius:15px;padding:7px 10px;font-size:12px;font-weight:800;color:#8a7290}.petals{letter-spacing:2px}.muted{opacity:.34;filter:grayscale(1)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.3vw,13px);width:min(100%,450px);margin:0 auto}.board.four{grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,315px)}.board.six{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,465px)}.board.twleve{grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,530px)}.cell{min-height:clamp(74px,11vw,103px);display:flex;align-items:center;justify-content:center;border:2px solid rgba(188,161,195,.53);border-radius:16px;background:rgba(255,255,255,.82);position:relative;transition:background .15s,transform .15s;padding:5px}.cell.clickable{cursor:pointer}.cell.clickable:active{transform:scale(.97)}.cell.selected{border-color:#bf76c2;background:#f7def2}.cell.correct{border-color:#6bac89;background:#dbf3e7}.cell.incorrect{border-color:#db7b85;background:#ffe5ea}.cell svg{width:clamp(48px,7.6vw,75px);height:clamp(48px,7.6vw,75px);overflow:visible;filter:drop-shadow(0 3px 2px rgba(80,62,82,.12))}.cell .question{font-size:27px;font-weight:900;color:#b69bc0}.cell .idx{position:absolute;top:4px;left:8px;color:#9a7fa1;font-size:12px;font-weight:900}
.timer{display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:800;color:#896496}.track{width:150px;height:9px;background:#e9dce9;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#d97faf,#ac90df);width:100%}.rules{padding:9px 13px;background:rgba(248,236,249,.88);border:1px solid #e9d1ed;border-radius:16px;font-weight:900;color:#84558d;font-size:clamp(13px,1.6vw,17px);max-width:710px}.example{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
@media(max-width:600px){#app{align-items:flex-start;padding:4px}.shell{border-radius:17px;min-height:100dvh;padding:9px;gap:8px}.stage{min-height:360px;padding:10px}.cell{min-height:62px;border-radius:11px}.cell svg{width:51px;height:51px}.tab{padding:8px 2px;font-size:11px}.footer{justify-content:center}.title{font-size:19px}}
</style>
</head><body><div id="app"><section class="shell">
<header class="top"><div><div class="title">🌷 Цветочная поляна</div><div class="sub">Нейроквест «Секрет маминого счастья»</div></div><div class="tag" id="tag">Выбор задания</div></header>
<nav class="tabs" aria-label="Задания"><button class="tab" type="button" data-task="0">1. Необычный цветок</button><button class="tab" type="button" data-task="1">2. Что изменилось?</button><button class="tab" type="button" data-task="2">3. Цветочный детектив</button></nav>
<div class="levels" aria-label="Сложность"><button class="level" type="button" data-level="0">★ Легко</button><button class="level" type="button" data-level="1">★★ Средне</button><button class="level" type="button" data-level="2">★★★ Сложно</button></div>
<main class="stage" id="stage" aria-live="polite"></main><div id="feedback" class="feedback" role="status"></div>
<footer class="footer"><span id="status">Выберите любое испытание</span><span class="petals" id="petals"></span><button class="btn secondary" id="home" type="button" style="min-height:32px;padding:6px 11px;font-size:12px">⌂ Меню</button></footer>
</section></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), stage=$('#stage'),feedback=$('#feedback'),tag=$('#tag');
let task=-1,lv=0,phase='home',data=null,selected=[],timerId=null,token=0;
const completed=new Set();
const colors={pink:'#f498c2',red:'#e77888',violet:'#ad92e2',blue:'#83b9e7',yellow:'#f1cb67',orange:'#eea16d',white:'#fff1e7',mint:'#98cdb0'};
const colorNames={pink:'розовые',red:'красные',violet:'фиолетовые',blue:'голубые',yellow:'жёлтые',orange:'оранжевые',white:'белые',mint:'мятные'};
const names=['Найди необычный цветок','Что изменилось?','Цветочный детектив'];
const rnd=n=>Math.floor(Math.random()*n),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function elt(t,c,txt){let n=document.createElement(t);if(c)n.className=c;if(txt!==undefined)n.textContent=txt;return n}
function btn(text,fn,secondary=false){let b=elt('button','btn'+(secondary?' secondary':''),text);b.type='button';b.addEventListener('click',fn);return b}
function heading(t,d){stage.append(elt('h1','',t));stage.append(elt('p','instruction',d))}
function actions(...buttons){let row=elt('div','actions');row.append(...buttons);stage.append(row)}
function msg(text='',ok=false){feedback.textContent=text;feedback.className='feedback'+(ok?' ok':'')}
function clear(){clearInterval(timerId);timerId=null;token++;stage.replaceChildren();msg()}
function update(){tag.textContent=task<0?'Выбор задания':`Задание ${task+1} · уровень ${lv+1}`;document.querySelectorAll('.tab').forEach((b,i)=>{b.className='tab'+(i===task?' active':Array.from({length:3},(_,l)=>completed.has(i+':'+l)).every(Boolean)?' done':'')});document.querySelectorAll('.level').forEach((b,i)=>{b.className='level'+(i===lv&&task>=0?' active':task>=0&&completed.has(task+':'+i)?' done':'')});$('#status').textContent=`Пройдено ${completed.size} из 9 уровней`;$('#petals').replaceChildren();for(let i=0;i<9;i++)$('#petals').append(elt('span',completed.has(Math.floor(i/3)+':'+(i%3))?'':'muted','🌸'))}
function flower(spec){const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('viewBox','0 0 100 100');s.setAttribute('role','img');s.setAttribute('aria-label',`${spec.petals} лепестков, ${colorNames[spec.color]}, ${spec.center==='yellow'?'жёлтая':'белая'} серединка`);let outer=spec.petals;for(let k=0;k<outer;k++){const p=document.createElementNS(ns,'ellipse');p.setAttribute('cx','50');p.setAttribute('cy','28');p.setAttribute('rx',outer>=7?'11.5':'14');p.setAttribute('ry','22');p.setAttribute('transform',`rotate(${k*360/outer} 50 50)`);p.setAttribute('fill',colors[spec.color]);p.setAttribute('stroke','#ffffff');p.setAttribute('stroke-width','1.3');s.append(p)}let center=document.createElementNS(ns,'circle');center.setAttribute('cx','50');center.setAttribute('cy','50');center.setAttribute('r','13');center.setAttribute('fill',spec.center==='yellow'?'#f4c753':'#fff6ee');center.setAttribute('stroke','#bd9675');center.setAttribute('stroke-width','1.5');s.append(center);let dot=document.createElementNS(ns,'circle');dot.setAttribute('cx','46');dot.setAttribute('cy','46');dot.setAttribute('r','3');dot.setAttribute('fill','#ffffff');dot.setAttribute('opacity','.65');s.append(dot);return s}
function board(specs,mode,onClick,columns=''){let b=elt('div','board'+(columns?' '+columns:''));specs.forEach((f,i)=>{let c=elt(mode==='button'?'button':'div','cell'+(mode==='button'?' clickable':''));if(mode==='button')c.type='button';c.setAttribute('aria-label',`Цветок ${i+1}`);if(f)c.append(flower(f));else c.append(elt('span','question','?'));if(mode==='button'){c.append(elt('span','idx',String(i+1)));c.addEventListener('click',()=>onClick(i,c))}b.append(c)});stage.append(b);return b}
function timed(duration,done){let id=token,seconds=duration;let row=elt('div','timer'),label=elt('span','',`Осталось ${seconds} с`),track=elt('div','track'),fill=elt('div','fill');track.append(fill);row.append(label,track);stage.append(row);const start=Date.now();timerId=setInterval(()=>{if(id!==token){clearInterval(timerId);return}let rest=Math.max(0,duration-(Date.now()-start)/1000);label.textContent=`Осталось ${Math.ceil(rest)} с`;fill.style.width=(rest/duration*100)+'%';if(rest<=0){clearInterval(timerId);timerId=null;done()}},70)}
function choose(t,l){clear();task=t;lv=l;phase='ready';data=null;selected=[];heading(names[t],[
'Сначала запомни, где находится цветок с другим количеством лепестков. Затем укажи его место по памяти.',
'Запомни расположение цветов. После их перестановки найди два цветка, которые поменялись местами.',
'Запомни секретное правило, затем по памяти найди все подходящие цветы. Следи за цветом, лепестками и серединкой.'
][t]);stage.append(elt('p','detail',['На каждом уровне на поляне 9 цветов. С каждым уровнем отличие становится менее заметным.','Уровень 1: 4 цветка · уровень 2: 6 цветов · уровень 3: 9 цветов.','Уровень 1: одно условие · уровень 2: два условия · уровень 3: три условия.'][t]));actions(btn('Начать испытание 🌷',start),btn('Выбрать другое задание',home,true));update()}
function makeOdd(){const normals=[5,6,7],odds=[4,5,8],palette=['pink','violet','blue'];let ordinary={petals:normals[lv],color:palette[lv],center:'yellow'},odd={...ordinary,petals:odds[lv]};let index=rnd(9);return {flowers:Array.from({length:9},(_,i)=>i===index?odd:{...ordinary}),index};}
function makeSwap(){
 let n=[4,6,9][lv],palette=shuffle(Object.keys(colors));
 let arr=Array.from({length:n},(_,i)=>({petals:5+(i%3),color:palette[i%palette.length],center:i%2?'white':'yellow'}));
 let i=rnd(n),j=rnd(n-1);if(j>=i)j++;
 while(arr[i].petals===arr[j].petals&&arr[i].color===arr[j].color&&arr[i].center===arr[j].center){j=(j+1)%n;if(j===i)j=(j+1)%n;}
 let swapped=[...arr];[swapped[i],swapped[j]]=[swapped[j],swapped[i]];
 return {original:arr,swapped,indices:[i,j],size:n};
}
function swapColumns(){return data.size===4?'four':data.size===6?'six':''}
function showSwapOriginal(){
 clear();selected=[];phase='show';
 heading('Запомни расположение','Постарайся запомнить, на каких местах находятся цветы.');
 board(data.original,'view',null,swapColumns());
 timed([9,8,7][lv],swapAnswer);
}
function makeDetect(){let rules=[{color:'pink'},{color:'pink',petals:5},{color:'pink',petals:5,center:'white'}],rule=rules[lv],n=lv===2?12:9;let arr=[];let positives=[2,3,3][lv];for(let i=0;i<positives;i++)arr.push({petals:rule.petals||5,color:rule.color,center:rule.center||'white'});
const neg=[{petals:6,color:'pink',center:'yellow'},{petals:4,color:'pink',center:'yellow'},{petals:5,color:'violet',center:'white'},{petals:5,color:'blue',center:'yellow'},{petals:6,color:'red',center:'white'},{petals:5,color:'pink',center:'yellow'},{petals:7,color:'orange',center:'white'},{petals:4,color:'yellow',center:'yellow'},{petals:7,color:'mint',center:'white'},{petals:6,color:'violet',center:'yellow'},{petals:5,color:'red',center:'white'}];for(const candidate of shuffle(neg)){if(arr.length>=n)break;if(!matches(candidate,rule))arr.push({...candidate})}while(arr.length<n){let z={petals:4+rnd(4),color:shuffle(Object.keys(colors))[0],center:Math.random()<.5?'yellow':'white'};if(!matches(z,rule))arr.push(z)}shuffle(arr);return {flowers:arr,rule,correct:arr.map((f,i)=>matches(f,rule)?i:-1).filter(i=>i>=0)}}
function matches(f,r){return Object.keys(r).every(k=>f[k]===r[k])}
function start(){clear();selected=[];phase='show';if(task===0){data=makeOdd();heading('Запоминай!','Найди глазами необычный цветок и запомни его место.');board(data.flowers,'view');timed([8,7,6][lv],oddAnswer)}else if(task===1){data=makeSwap();showSwapOriginal()}else{data=makeDetect();heading('Секретное правило','Прочитай правило и удержи его в памяти. Оно исчезнет!');let t=['Найди все РОЗОВЫЕ цветы.','Найди все РОЗОВЫЕ цветы, у которых 5 лепестков.','Найди все РОЗОВЫЕ цветы с 5 лепестками, но НЕ нажимай цветы с жёлтой серединкой.'][lv];stage.append(elt('div','rules',t));stage.append(elt('p','detail','После исчезновения инструкции выбери все цветы, подходящие под правило.'));timed([8,9,11][lv],detectAnswer)}update()}
function oddAnswer(){clear();phase='answer';heading('Где необычный цветок?','Цветы спрятались! Нажми на место, где был цветок с другим количеством лепестков.');board(Array(9).fill(null),'button',(i,c)=>{if(phase!=='answer')return;if(i===data.index){c.classList.add('correct');success()}else{c.classList.add('incorrect');msg('Пока не угадал. Вспомни расположение и попробуй ещё!')}});actions(btn('Посмотреть снова',start,true))}
function swapAnswer(){clear();phase='answer';heading('Что изменилось?','Два цветка поменялись местами! Выбери оба новых места их расположения.');let b=board(data.swapped,'button',(index,c)=>{if(phase!=='answer')return;let k=selected.indexOf(index);if(k>=0){selected.splice(k,1);c.classList.remove('selected')}else if(selected.length<2){selected.push(index);c.classList.add('selected')}check.disabled=selected.length!==2},swapColumns());let check=btn('Проверить ✓',()=>{if(selected.length!==2)return;if(selected.every(k=>data.indices.includes(k))){data.indices.forEach(k=>b.children[k].classList.add('correct'));success()}else{msg('Не совсем так. Сравни цветы в памяти и попробуй ещё!');selected=[];[...b.children].forEach(c=>c.classList.remove('selected'));check.disabled=true}});check.disabled=true;actions(check,btn('Посмотреть снова',showSwapOriginal,true))}
function detectAnswer(){clear();phase='answer';selected=[];heading('Цветочный детектив 🔎','Вспомни секретное правило. Выбери все подходящие цветы и нажми «Проверить».');let b=board(data.flowers,'button',(i,c)=>{if(phase!=='answer')return;let p=selected.indexOf(i);if(p>=0){selected.splice(p,1);c.classList.remove('selected')}else{selected.push(i);c.classList.add('selected')}} ,lv===2?'twleve':'');actions(btn('Проверить ✓',()=>{if(selected.length===data.correct.length&&selected.every(i=>data.correct.includes(i))){data.correct.forEach(i=>b.children[i].classList.add('correct'));success()}else msg('Проверь, всем ли условиям соответствуют выбранные цветы. Попробуй ещё!')}),btn('Повторить правило',start,true))}
function success(){phase='success';completed.add(task+':'+lv);msg('Верно! Волшебная поляна сияет ярче! ✨',true);actions(btn('Другой уровень',()=>choose(task,(lv+1)%3)),btn('Выбрать задание',home,true),btn('Получить лепесток 🌸',finish,true));update()}
function finish(){clear();phase='finish';stage.append(elt('div','', '🌸 ✨ 🌸'));heading('Лепесток радости!','Ты помог вернуть волшебство Цветочной поляне. Фея Мила благодарит тебя!');stage.append(elt('p','detail',`Выполнено ${completed.size} из 9 испытаний. Остальные задания можно пройти отдельно.`));actions(btn('К выбору заданий',home));update()}
function home(){clear();task=-1;phase='home';heading('Добро пожаловать на Цветочную поляну! 🌷','Волшебный ветер перепутал цветы. Помоги восстановить порядок, тренируя зрительную память и внимание.');stage.append(elt('p','detail','Выбирай любое задание и любой уровень — проходить их по порядку необязательно.'));actions(btn('1. Необычный цветок',()=>choose(0,0)),btn('2. Что изменилось?',()=>choose(1,0)),btn('3. Детектив',()=>choose(2,0)));update()}
document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.task),0)));
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>choose(task<0?0:task,Number(b.dataset.level))));
$('#home').addEventListener('click',home);home();
})();
</script></body></html>
